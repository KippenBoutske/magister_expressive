name: Android build

on:
  push:
    branches:
      - main
      - "vibe/**"
  pull_request:
    branches:
      - main

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android-sdk@v3
        with:
          cmdline-tools-version: latest
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
          licenses: |
            24333f8a63b6825ea9c5514f83c2829b004d1fee
            d56f5187479451eabf01fb78af6dfcb131a6481e

      - name: Set up Gradle 8.14.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.2

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle.kts', 'build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate wrapper and build debug APK
        run: |
          gradle wrapper --gradle-version 8.14.2 --no-daemon
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

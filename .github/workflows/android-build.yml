name: Android build

on:
  push:
    branches:
      - main
      - "vibe/**"
  pull_request:
    branches:
      - main

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Update cmdline-tools and install Android SDK components
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --update
          yes | "$SDKMGR" --licenses > /dev/null
          "$SDKMGR" --list_installed | grep -E "^(platforms|build-tools)" || true
          "$SDKMGR" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 8.14.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle.kts', 'build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate wrapper and build debug APK
        run: |
          gradle wrapper --gradle-version 9.6.0 --no-daemon
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
